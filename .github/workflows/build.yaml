name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: stable

    - if: ${{ matrix.os == 'ubuntu-latest' }}
      name: "Install dependencies"
      run: |
        sudo apt update
        sudo apt install -y pcscd pcsc-tools opensc-pkcs11 libpcsclite-dev

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...